<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ألعاب الألغاز - Ball Sort</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0d0e15;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px 10px;
        }

        header {
            text-align: center;
            margin-top: 10px;
        }

        h1 {
            font-size: 1.5rem;
            color: #00f3ff;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .game-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            height: 350px;
            margin: auto 0;
        }

        .tube {
            width: 60px;
            height: 200px;
            border: 3px solid #00f3ff;
            border-top: none;
            border-radius: 0 0 25px 25px;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            padding-bottom: 5px;
            gap: 5px;
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.2), inset 0 0 10px rgba(0, 243, 255, 0.1);
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .tube.selected {
            border-color: #ff007f;
            box-shadow: 0 0 18px rgba(255, 0, 127, 0.6), inset 0 0 12px rgba(ff, 0, 127, 0.2);
            transform: translateY(-8px);
        }

        .ball {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            transition: transform 0.2s ease, top 0.2s ease;
        }

        .red { background: radial-gradient(circle at 30% 30%, #ff5555, #990000); box-shadow: 0 0 8px rgba(255, 85, 85, 0.5); }
        .blue { background: radial-gradient(circle at 30% 30%, #55ffff, #0088cc); box-shadow: 0 0 8px rgba(85, 255, 255, 0.5); }
        .yellow { background: radial-gradient(circle at 30% 30%, #ffff55, #cc9900); box-shadow: 0 0 8px rgba(255, 255, 85, 0.5); }

        .controls {
            margin-bottom: 20px;
        }

        button {
            background: linear-gradient(45deg, #00f3ff, #ff007f);
            border: none;
            color: white;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
            cursor: pointer;
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <header>
        <h1>فرز الكرات - Ball Sort</h1>
    </header>

    <div class="game-container" id="gameBoard">
        <!-- الأنابيب والكرات سيتم إنشاؤها عبر JavaScript -->
    </div>

    <div class="controls">
        <button onclick="initGame()">إعادة التشغيل</button>
    </div>

    <script>
        const tubesData = [
            ['yellow', 'red', 'yellow', 'red'],
            ['blue', 'yellow', 'blue', 'red'],
            ['red', 'blue', 'yellow', 'blue'],
            []
        ];

        let state = [];
        let selectedTubeIndex = null;

        function initGame() {
            state = JSON.parse(JSON.stringify(tubesData));
            selectedTubeIndex = null;
            render();
        }

        function render() {
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';

            state.forEach((tube, index) => {
                const tubeEl = document.createElement('div');
                tubeEl.className = `tube ${selectedTubeIndex === index ? 'selected' : ''}`;
                tubeEl.onclick = () => handleTubeClick(index);

                tube.forEach(color => {
                    const ballEl = document.createElement('div');
                    ballEl.className = `ball ${color}`;
                    tubeEl.appendChild(ballEl);
                });

                board.appendChild(tubeEl);
            });
        }

        function handleTubeClick(index) {
            if (selectedTubeIndex === null) {
                if (state[index].length > 0) {
                    selectedTubeIndex = index;
                }
            } else if (selectedTubeIndex === index) {
                selectedTubeIndex = null;
            } else {
                const source = state[selectedTubeIndex];
                const target = state[index];

                if (target.length < 4) {
                    if (target.length === 0 || target[target.length - 1] === source[source.length - 1]) {
                        target.push(source.pop());
                    }
                }
                selectedTubeIndex = null;
            }
            render();
        }

        initGame();
    </script>
</body>
</html>
