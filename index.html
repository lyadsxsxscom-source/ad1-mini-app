<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاهدة الإعلان</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f4f4f9; padding: 20px; }
        .card { background: white; padding: 25px 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-top: 20px; }
        .btn { display: inline-block; padding: 14px 28px; background-color: #2a82c4; color: white; text-decoration: none; border-radius: 10px; font-weight: bold; font-size: 16px; border: none; margin-top: 20px; cursor: pointer; width: 80%; }
        #timer-box { font-size: 18px; font-weight: bold; color: #2a82c4; margin-top: 15px; }
        #warning { color: #d9534f; font-weight: bold; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎬 مشاهدة الإعلان</h2>
        <p>اضغط على الزر لمشاهدة الإعلان. <b>يجب عدم الخروج من هذه الشاشة</b> ليكتمل العداد!</p>
        
        <button id="ad-btn" class="btn" onclick="openAdAndStart()">🔗 اضغط هنا لمشاهدة الإعلان</button>

        <div id="timer-box"></div>
        <div id="warning">⚠️ تم إيقاف العداد لأنك غادرت التطبيق! يرجى إبقاء التطبيق مفتوحاً.</div>
    </div>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        let timerStarted = false;
        let timeLeft = 15;
        let interval = null;
        let isWindowActive = true;

        // كشف فقدان التركيز (عند الانتقال لمتصفح آخر أو تطبييق آخر)
        window.addEventListener('blur', function() {
            isWindowActive = false;
            showWarning(true);
        });

        window.addEventListener('focus', function() {
            isWindowActive = true;
            showWarning(false);
        });

        document.addEventListener("visibilitychange", function() {
            if (document.hidden) {
                isWindowActive = false;
                showWarning(true);
            } else {
                isWindowActive = true;
                showWarning(false);
            }
        });

        function showWarning(show) {
            const warningElem = document.getElementById('warning');
            if (timerStarted && timeLeft > 0) {
                warningElem.style.display = show ? "block" : "none";
            }
        }

        function openAdAndStart() {
            const adUrl = "https://www.effectivecpmnetwork.com/g6tesg3dw?key=504cabf2ea751d490e611ef136c7f49b";
            
            // فتح الإعلان عبر رابط التلغرام الداخلي بدلاً من نافذة مستقلة خارجية
            Telegram.WebApp.openLink(adUrl);

            if (timerStarted) return;
            timerStarted = true;

            const timerBox = document.getElementById('timer-box');
            timerBox.innerText = `⏳ يرجى الانتظار ${timeLeft} ثانية...`;

            interval = setInterval(() => {
                // إذا خُرج من الشاشة أو لم تكن الشاشة نشطة يُجمّد العداد فوراً
                if (!isWindowActive || document.hidden) {
                    showWarning(true);
                    return; 
                }

                timeLeft--;
                timerBox.innerText = `⏳ يرجى الانتظار ${timeLeft} ثانية...`;

                if (timeLeft <= 0) {
                    clearInterval(interval);
                    timerBox.innerText = "✅ تم التحقق بنجاح! جاري إضافة النقاط...";
                    
                    setTimeout(() => {
                        Telegram.WebApp.sendData(JSON.stringify({ status: "success" }));
                    }, 1000);
                }
            }, 1000);
        }
    </script>
</body>
</html>
