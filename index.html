<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mall Games App</title>
    <!-- مكتبة تليجرام -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: #ffffff; text-align: center; padding: 20px; margin: 0; }
        .card { background-color: #1e1e1e; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); max-width: 400px; margin: 20px auto; }
        h1 { font-size: 22px; color: #0088cc; }
        .btn { display: block; width: 90%; padding: 14px; margin: 15px auto; background-color: #0088cc; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; }
        .btn-adsterra { background-color: #ff9800; }
        .hidden { display: none; }
        .timer-text { font-weight: bold; color: #ff9800; font-size: 16px; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>مرحباً بك في Mall Games App! 🎁</h1>
        
        <div id="telegram-view" class="hidden">
            <p>أهلاً بك يا <b id="user-name" style="color: #0088cc;">مستخدم</b> 👋</p>
            
            <a href="https://www.fastsvr.com/wall/UG2x1" class="btn" target="_blank">
                🎯 إكمال المهام والعروض
            </a>
            
            <button id="ad-btn" class="btn btn-adsterra" onclick="startAdProcess()">
                ⚡ مشاهدة إعلان سريع (+10 نقاط)
            </button>
            
            <div id="timer-status" class="timer-text hidden"></div>
        </div>

        <div id="browser-view" class="hidden">
            <p>يرجى فتح البوت عبر التليجرام للوصول للميزات.</p>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;

        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            tg.expand();
            document.getElementById('telegram-view').classList.remove('hidden');
            document.getElementById('user-name').innerText = tg.initDataUnsafe.user.first_name || "المستخدم";
        } else {
            document.getElementById('browser-view').classList.remove('hidden');
        }

        const adUrl = "https://www.effectivecpmnetwork.com/g6tesg3dw?key=504cabf2ea751d490e611ef136c7f49b";
        let timeLeft = 15;
        let timerInterval = null;

        function startAdProcess() {
            window.open(adUrl, '_blank');

            const btn = document.getElementById('ad-btn');
            const timerStatus = document.getElementById('timer-status');
            
            btn.disabled = true;
            timerStatus.classList.remove('hidden');
            timerStatus.innerText = `⏳ يرجى البقاء في صفحة الإعلان... (15 ثانية)`;

            timerInterval = setInterval(() => {
                if (document.visibilityState === 'hidden') {
                    timeLeft--;
                    timerStatus.innerText = `⏳ جاري احتساب الوقت... (${timeLeft} ثانية)`;
                } else if (timeLeft < 15 && timeLeft > 0) {
                    timerStatus.innerText = `⚠️ عدت مبكراً! يرجى العودة للإعلان (${timeLeft} ثانية)`;
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerStatus.innerText = "⏳ جاري إرسال النقاط لحسابك...";
                    
                    const userId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : null;

                    if (userId) {
                        // إرسال طلب أوتوماتيكي لسيرفر PythonAnywhere الخاص بك
                        fetch('https://IbrahimKazmoz.pythonanywhere.com/api/add-points', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                user_id: userId,
                                amount: 0.0050 // قيمة الإعلان بالدولار
                            })
                        })
                        .then(response => response.json())
                        .then(data => {
                            if (data.status === 'success') {
                                timerStatus.innerText = "✅ تمت إضافة النقاط لرصيدك بنجاح!";
                                setTimeout(() => { if (tg) tg.close(); }, 1500);
                            } else {
                                timerStatus.innerText = "❌ حدث خطأ أثناء احتساب النقاط.";
                            }
                        })
                        .catch(err => {
                            console.error(err);
                            timerStatus.innerText = "❌ تعذر الاتصال بالسيرفر.";
                        });
                    } else {
                        alert("تمت العملية لكن تعذر التعرف على حساب التليجرام!");
                    }
                }
            }, 1000);
        }
    </script>
</body>
</html>
