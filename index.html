<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاهدة إعلان فيديو</title>
    <!-- مكتبة التلغرام الرسمية -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- مكتبة Adsgram الرسمية -->
    <script src="https://sad.adsgram.ai/js/sad-b.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f4f4f9; padding: 20px; }
        .card { background: white; padding: 25px 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-top: 30px; }
        .btn { display: inline-block; padding: 14px 28px; background-color: #2a82c4; color: white; border-radius: 10px; font-weight: bold; font-size: 16px; border: none; margin-top: 20px; cursor: pointer; width: 80%; }
        #status { font-size: 16px; font-weight: bold; margin-top: 15px; line-height: 1.5; }
        .error { color: #d9534f; }
        .success { color: #5cb85c; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎬 مشاهدة إعلان فيديو</h2>
        <p>اضغط على الزر وشاهد الفيديو الإعلاني كاملاً للحصول على مكافأتك!</p>
        
        <button class="btn" onclick="showAd()">🎬 تشغيل الفيديو الآن</button>

        <div id="status"></div>
    </div>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        // ربط Adsgram باستخدام الـ Block ID الخاص بك (42276)
        const AdController = window.Adsgram.init({ blockId: "42276" });

        function showAd() {
            const statusBox = document.getElementById('status');
            statusBox.className = "";
            statusBox.innerText = "⏳ جاري تحميل الفيديو...";

            AdController.show().then((result) => {
                // تم إكمال الفيديو بنجاح!
                statusBox.className = "success";
                statusBox.innerText = "✅ تم مشاهدة الفيديو بنجاح! جاري إضافة النقاط...";
                
                setTimeout(() => {
                    Telegram.WebApp.sendData(JSON.stringify({ status: "success" }));
                }, 1000);

            }).catch((result) => {
                // المستخدم أغلق الفيديو قبل انتهائه أو لم يتوفر إعلان
                statusBox.className = "error";
                statusBox.innerText = "❌ لم يكتمل مشاهدة الفيديو، تم إلغاء المكافأة!";
            });
        }
    </script>
</body>
</html>
