<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>فرز الكرات - Ball Sort</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d0e15;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px 10px;
            overflow: hidden;
        }

        header h1 {
            font-size: 1.6rem;
            color: #00f3ff;
            text-shadow: 0 0 12px rgba(0, 243, 255, 0.6);
            margin-top: 10px;
        }

        .game-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 12px;
            width: 100%;
            max-width: 420px;
            height: 360px;
            margin: auto 0;
        }

        .tube {
            width: 65px;
            height: 220px;
            position: relative;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            padding-bottom: 8px;
            gap: 4px;
            cursor: pointer;
            /* خلفية الأنبوب باستخدام صورتك */
            background: url('tube.png') no-repeat center bottom / contain;
            transition: transform 0.2s ease;
        }

        .tube.selected {
            transform: translateY(-10px);
            filter: drop-shadow(0 0 8px #ff007f);
        }

        .ball {
            width: 48px;
            height: 48px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ربط الكرات بالصور المرفوعة */
        .ball.red { background-image: url('red.png'); }
        .ball.blue { background-image: url('blue.png'); }
        .ball.yellow { background-image: url('yellow.png'); }

        /* حركة خروج الكرة لأعلى الأنبوب عند الاختيار */
        .ball.popped {
            transform: translateY(-40px);
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.8));
        }

        .controls {
            margin-bottom: 25px;
        }

        button {
            background: linear-gradient(45deg, #00f3ff, #ff007f);
            border: none;
            color: white;
            padding: 12px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
            cursor: pointer;
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <header>
        <h1>فرز الكرات - Ball Sort</h1>
    </header>

    <div class="game-container" id="gameBoard"></div>

    <div class="controls">
        <button onclick="initGame()">إعادة اللعب</button>
    </div>

    <script>
        const initialTubes = [
            ['red', 'yellow', 'blue', 'yellow'],
            ['blue', 'red', 'yellow', 'red'],
            ['red', 'blue', 'yellow', 'blue'],
            []
        ];

        let state = [];
        let selectedTubeIndex = null;

        function initGame() {
            state = JSON.parse(JSON.stringify(initialTubes));
            selectedTubeIndex = null;
            render();
        }

        function render() {
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';

            state.forEach((tube, tubeIdx) => {
                const tubeEl = document.createElement('div');
                const isSelected = selectedTubeIndex === tubeIdx;
                tubeEl.className = `tube ${isSelected ? 'selected' : ''}`;
                tubeEl.onclick = () => handleTubeClick(tubeIdx);

                tube.forEach((color, ballIdx) => {
                    const ballEl = document.createElement('div');
                    const isTopBall = ballIdx === tube.length - 1;
                    ballEl.className = `ball ${color} ${isSelected && isTopBall ? 'popped' : ''}`;
                    tubeEl.appendChild(ballEl);
                });

                board.appendChild(tubeEl);
            });
        }

        function handleTubeClick(index) {
            if (selectedTubeIndex === null) {
                if (state[index].length > 0) {
                    selectedTubeIndex = index;
                }
            } else if (selectedTubeIndex === index) {
                selectedTubeIndex = null;
            } else {
                const source = state[selectedTubeIndex];
                const target = state[index];

                if (target.length < 4) {
                    if (target.length === 0 || target[target.length - 1] === source[source.length - 1]) {
                        target.push(source.pop());
                    }
                }
                selectedTubeIndex = null;
            }
            render();
        }

        initGame();
    </script>
</body>
</html>
