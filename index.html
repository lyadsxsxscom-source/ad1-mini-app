<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mall Games App</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #151e27;
      color: #ffffff;
      padding: 20px;
      margin: 0;
      text-align: center;
    }
    .container { max-width: 400px; margin: 0 auto; }
    .hidden { display: none !important; }
    
    .welcome-box { font-size: 18px; margin-bottom: 20px; font-weight: bold; color: #38bdf8; }
    
    .btn {
      display: block; width: 100%; padding: 14px; margin: 12px 0; border: none; border-radius: 10px;
      font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none;
      box-sizing: border-box; color: #ffffff; transition: opacity 0.2s ease;
    }
    .btn:active { opacity: 0.8; }
    
    .btn-offerwall { background-color: #f59e0b; }
    .btn-ad { background-color: #10b981; }
    .btn-cpx { background-color: #0088cc; }
    .btn-claim { background-color: #ec4899; }
    
    .timer-status { margin-top: -6px; margin-bottom: 10px; font-size: 14px; color: #facc15; }
    .vpn-alert { background: #7f1d1d; color: #fca5a5; padding: 20px; border-radius: 10px; margin-top: 20px; }
  </style>
</head>
<body>

  <div class="container">
    <div id="vpn-view" class="hidden">
      <div class="vpn-alert">⚠️ تم اكتشاف VPN! يرجى إيقاف الـ VPN للمتابعة.</div>
    </div>

    <div id="telegram-view" class="hidden">
      <div class="welcome-box">
        مرحباً بك، <span id="user-name">المستخدم</span> 👋
      </div>

      <a id="offerwall-link" href="#" target="_blank" class="btn btn-offerwall">🔥 تنفيذ العروض (FastSvr)</a>

      <!-- زر مشاهدة الإعلان -->
      <button id="ad-btn" onclick="startAdProcess()" class="btn btn-ad">
        🎬 مشاهدة إعلان (+10 نقاط)
      </button>

      <div id="timer-status" class="timer-status hidden"></div>

      <button onclick="openCpxSurveys()" class="btn btn-cpx">
        📋 استبيانات CPX Research
      </button>
    </div>

    <div id="browser-view" class="hidden">
      <p>يرجى فتح البوت عبر التليجرام للوصول للميزات.</p>
    </div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    const adUrl = "https://www.effectivecpmnetwork.com/g6tesg3dw?key=504cabf2ea751d490e611ef136c7f49b";
    const REQUIRED_SECONDS = 30;
    
    let accumulatedAwayTime = 0; // مجموع الثواني التي قضاها خارج التليجرام
    let leftTime = null;         // توقيت لحظة الخروج
    let isAdActive = false;

    async function checkVPN() {
      try {
        const res = await fetch('https://ipapi.co/json/');
        const data = await res.json();
        if (data.proxy || data.hosting) return true;
      } catch (e) { console.log("تجاوز الفحص"); }
      return false;
    }

    async function initApp() {
      if (!tg) {
        document.getElementById('browser-view').classList.remove('hidden');
        return;
      }
      tg.ready(); 
      tg.expand();
      
      const isVPN = await checkVPN();
      if (isVPN) {
        document.getElementById('vpn-view').classList.remove('hidden');
        return;
      }
      document.getElementById('telegram-view').classList.remove('hidden');
      
      const offerwallBase = "https://www.fastsvr.com/wall/UG2x1";
      const linkElement = document.getElementById('offerwall-link');
      if (linkElement && tg.initDataUnsafe?.user) {
        linkElement.href = offerwallBase + "?subid=" + tg.initDataUnsafe.user.id; 
      } else if(linkElement) { linkElement.href = offerwallBase; }

      startUsernameInterval();
    }

    function startUsernameInterval() {
      let checkCount = 0;
      const nameInterval = setInterval(() => {
        checkCount++;
        const name = getUserName();
        if (name) {
          document.getElementById('user-name').innerText = name;
          clearInterval(nameInterval);
        } else if (checkCount > 40) {
          clearInterval(nameInterval);
          document.getElementById('user-name').innerText = "المستخدم";
        }
      }, 100);
    }

    function getUserName() {
      const urlParams = new URLSearchParams(window.location.search);
      const nameFromUrl = urlParams.get('name') || urlParams.get('first_name');
      if (nameFromUrl) return decodeURIComponent(nameFromUrl);
      if (tg?.initDataUnsafe?.user?.first_name) return tg.initDataUnsafe.user.first_name;
      return null;
    }

    // --- 🛡️ منطق الحماية ضد الغش ---
    function startAdProcess() {
      const btn = document.getElementById('ad-btn');
      const timerStatus = document.getElementById('timer-status');
      
      isAdActive = true;
      leftTime = Date.now(); // تسجيل وقت المغادرة فوراً

      // فتح رابط الإعلان
      if (tg && tg.openLink) {
        tg.openLink(adUrl);
      } else {
        window.open(adUrl, '_blank');
      }

      btn.disabled = true;
      timerStatus.classList.remove('hidden');
      timerStatus.style.color = "#facc15";
      timerStatus.innerText = "⏳ يرجى البقاء داخل الإعلان لمدة 30 ثانية...";
    }

    // حاسبة الوقت عند العودة للتطبيق
    function handleReturn() {
      if (!isAdActive || !leftTime) return;

      const now = Date.now();
      const secondsSpentAway = Math.floor((now - leftTime) / 1000);
      
      if (secondsSpentAway > 0) {
        accumulatedAwayTime += secondsSpentAway;
      }
      leftTime = null;

      updateUI();
    }

    function updateUI() {
      const btn = document.getElementById('ad-btn');
      const timerStatus = document.getElementById('timer-status');
      const remaining = REQUIRED_SECONDS - accumulatedAwayTime;

      if (remaining <= 0) {
        // تم إكمال الـ 30 ثانية بالكامل خارج التطبيق
        isAdActive = false;
        timerStatus.style.color = "#10b981";
        timerStatus.innerText = "🎉 ممتاز! أكملت 30 ثانية داخل الإعلان. اضغط للتحصيل 👇";
        
        btn.disabled = false;
        btn.className = "btn btn-claim";
        btn.innerText = "🎁 اضغط هنا لاستلام المكافأة (+10 نقاط)";
        btn.onclick = claimReward;
      } else {
        // لم يكمل الـ 30 ثانية
        timerStatus.style.color = "#facc15";
        timerStatus.innerText = `⏳ بقيت ${accumulatedAwayTime} ثانية في الإعلان. متبقي ${remaining} ثانية!`;
        
        btn.disabled = false;
        btn.className = "btn btn-ad";
        btn.innerText = `🎬 إكمال مشاهدة الإعلان (متبقي ${remaining} ثانية)`;
        btn.onclick = startAdProcess;
      }
    }

    // كشف لحظة عودة المستخدم للتطبيق
    document.addEventListener("visibilitychange", function() {
      if (!document.hidden) {
        handleReturn();
      } else if (isAdActive && !leftTime) {
        leftTime = Date.now();
      }
    });

    window.addEventListener("focus", function() {
      handleReturn();
    });

    function claimReward() {
      alert("تمت إضافة النقاط بنجاح!"); 
      if (tg) {
        tg.sendData(JSON.stringify({ action: "add_points", amount: 0.0010 }));
        setTimeout(() => { tg.close(); }, 800);
      }
    }

    function openCpxSurveys() {
      let userId = (tg && tg.initDataUnsafe?.user) ? tg.initDataUnsafe.user.id : '123456';
      const cpxUrl = `https://offers.cpx-research.com/index.php?app_id=35328&ext_user_id=${userId}`;
      tg?.openLink ? tg.openLink(cpxUrl) : window.open(cpxUrl, '_blank');
    }

    window.onload = initApp;
  </script>
</body>
</html>
