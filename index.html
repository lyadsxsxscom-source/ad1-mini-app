<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>فرز الكرات - Ball Sort</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d0e15;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px 10px;
            overflow: hidden;
        }

        header h1 {
            font-size: 1.6rem;
            color: #00f3ff;
            text-shadow: 0 0 12px rgba(0, 243, 255, 0.6);
            margin-top: 10px;
        }

        .game-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 12px;
            width: 100%;
            max-width: 420px;
            height: 360px;
            margin: auto 0;
            position: relative;
        }

        .tube {
            width: 65px;
            height: 230px;
            position: relative;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            padding-bottom: 12px;
            padding-top: 15px;
            gap: 2px;
            cursor: pointer;
            background-image: url('Tube.png');
            background-repeat: no-repeat;
            background-position: center bottom;
            background-size: 100% 100%;
            transition: transform 0.3s ease;
        }

        .tube.selected {
            transform: translateY(-12px);
            filter: drop-shadow(0 0 10px #ff007f);
        }

        .ball {
            width: 42px;
            height: 42px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transition: transform 0.3s ease-in-out;
        }

        /* الألوان */
        .ball.red { background-image: url('red.png'); }
        .ball.blue { background-image: url('blue.png'); }
        .ball.yellow { background-image: url('yellow.png'); }
        .ball.green { background-image: url('green.png'); }
        .ball.orange { background-image: url('orange.png'); }
        .ball.purple { background-image: url('purple.png'); }
        .ball.pink { background-image: url('pink.png'); }
        .ball.cyan-turquoise { background-image: url('cyan-turquoise.png'); }
        .ball.lavender-light_blue { background-image: url('lavender-light_blue.png'); }
        .ball.magenta-pink { background-image: url('magenta-pink.png'); }
        .ball.silver-grey { background-image: url('silver-grey.png'); }

        .ball.popped {
            transform: translateY(-45px);
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9));
        }

        /* الكرة الطائرة بأمان بدون اختفاء */
        .flying-ball {
            position: absolute;
            width: 42px;
            height: 42px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 100;
            pointer-events: none;
            filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.9));
            transition: all 0.5s ease-in-out;
        }

        .controls {
            margin-bottom: 25px;
        }

        button {
            background: linear-gradient(45deg, #00f3ff, #ff007f);
            border: none;
            color: white;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
            cursor: pointer;
        }

        button:active {
            transform: scale(0.95);
        }

        .win-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(13, 14, 21, 0.85);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 150;
        }

        .win-modal.active {
            display: flex;
        }

        .win-box {
            background: #161824;
            border: 2px solid #00f3ff;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
        }

        .win-box h2 {
            color: #ff007f;
            margin-bottom: 15px;
            text-shadow: 0 0 10px #ff007f;
        }
    </style>
</head>
<body>

    <header>
        <h1>فرز الكرات - Ball Sort</h1>
    </header>

    <div class="game-container" id="gameBoard"></div>

    <div class="controls">
        <button onclick="initGame()">إعادة اللعب</button>
    </div>

    <div class="win-modal" id="winModal">
        <div class="win-box">
            <h2>مبروك! أتقنت الفرز 🎉</h2>
            <button onclick="initGame()">المرحلة التالية</button>
        </div>
    </div>

    <script>
        const initialTubes = [
            ['red', 'yellow', 'blue', 'yellow'],
            ['blue', 'red', 'yellow', 'red'],
            ['red', 'blue', 'yellow', 'blue'],
            []
        ];

        let state = [];
        let selectedTubeIndex = null;
        let isAnimating = false;

        function initGame() {
            state = JSON.parse(JSON.stringify(initialTubes));
            selectedTubeIndex = null;
            isAnimating = false;
            document.getElementById('winModal').classList.remove('active');
            render();
        }

        function render() {
            const board = document.getElementById('gameBoard');
            const flyingElements = Array.from(board.querySelectorAll('.flying-ball'));
            board.innerHTML = '';
            flyingElements.forEach(el => board.appendChild(el));

            state.forEach((tube, tubeIdx) => {
                const tubeEl = document.createElement('div');
                const isSelected = selectedTubeIndex === tubeIdx;
                tubeEl.className = `tube ${isSelected ? 'selected' : ''}`;
                tubeEl.onclick = () => handleTubeClick(tubeIdx);

                const sameColorCount = getTopMatchCount(tube);

                tube.forEach((color, ballIdx) => {
                    const ballEl = document.createElement('div');
                    const isPopped = isSelected && (ballIdx >= tube.length - sameColorCount);
                    ballEl.className = `ball ${color} ${isPopped ? 'popped' : ''}`;
                    tubeEl.appendChild(ballEl);
                });

                board.appendChild(tubeEl);
            });

            checkWin();
        }

        function getTopMatchCount(tube) {
            if (tube.length === 0) return 0;
            const topColor = tube[tube.length - 1];
            let count = 0;
            for (let i = tube.length - 1; i >= 0; i--) {
                if (tube[i] === topColor) count++;
                else break;
            }
            return count;
        }

        async function handleTubeClick(index) {
            if (isAnimating) return;

            if (selectedTubeIndex === null) {
                if (state[index].length > 0) {
                    selectedTubeIndex = index;
                    render();
                }
            } else if (selectedTubeIndex === index) {
                selectedTubeIndex = null;
                render();
            } else {
                const sourceIdx = selectedTubeIndex;
                const targetIdx = index;
                const source = state[sourceIdx];
                const target = state[targetIdx];

                if (source.length > 0) {
                    const movingColor = source[source.length - 1];
                    const countToMove = getTopMatchCount(source);
                    const availableSpace = 4 - target.length;

                    if (availableSpace > 0 && (target.length === 0 || target[target.length - 1] === movingColor)) {
                        const actualMove = Math.min(countToMove, availableSpace);
                        
                        isAnimating = true;

                        for (let i = 0; i < actualMove; i++) {
                            const colorToMove = source.pop();
                            selectedTubeIndex = null;
                            render();

                            await animateFly(sourceIdx, targetIdx, colorToMove);
                            
                            target.push(colorToMove);
                            render();
                        }

                        isAnimating = false;
                        return;
                    }
                }
                selectedTubeIndex = null;
                render();
            }
        }

        function animateFly(fromIdx, toIdx, color) {
            return new Promise(resolve => {
                const board = document.getElementById('gameBoard');
                const tubes = board.getElementsByClassName('tube');
                
                const fromTube = tubes[fromIdx];
                const toTube = tubes[toIdx];

                const fromRect = fromTube.getBoundingClientRect();
                const toRect = toTube.getBoundingClientRect();
                const boardRect = board.getBoundingClientRect();

                // حساب إحداثيات واضحة ومضمونة داخل إطار اللعبة
                const startX = fromRect.left - boardRect.left + (fromRect.width - 42) / 2;
                const topAirY = 10; // ارتفاع الطيران الأفقية الأعلى في الهواء
                
                const endX = toRect.left - boardRect.left + (toRect.width - 42) / 2;
                const targetSlotIndex = state[toIdx].length; 
                // حساب العلو الحقيقي لاستقرار الكرة داخل الزجاجة الجديدة
                const endY = boardRect.height - 25 - (targetSlotIndex * 44);

                // إنشاء عنصر الكرة المتحركة
                const flyer = document.createElement('div');
                flyer.className = `flying-ball ${color}`;
                flyer.style.left = `${startX}px`;
                flyer.style.top = `${fromRect.top - boardRect.top + 10}px`; // البداية من رأس الزجاجة الأولى
                board.appendChild(flyer);

                // 1. الصعود إلى الهواء فوق الزجاجات
                setTimeout(() => {
                    flyer.style.top = `${topAirY}px`;
                }, 30);

                // 2. الانتقال الأفقي نحو الزجاجة الجديدة
                setTimeout(() => {
                    flyer.style.left = `${endX}px`;
                }, 400);

                // 3. الهبوط داخل الزجاجة الجديدة
                setTimeout(() => {
                    flyer.style.top = `${endY}px`;
                }, 750);

                // الانتهاء واستقرار الكرة
                setTimeout(() => {
                    flyer.remove();
                    resolve();
                }, 1100);
            });
        }

        function checkWin() {
            const isWin = state.every(tube => {
                if (tube.length === 0) return true;
                if (tube.length === 4) {
                    return tube.every(color => color === tube[0]);
                }
                return false;
            });

            if (isWin) {
                setTimeout(() => {
                    document.getElementById('winModal').classList.add('active');
                }, 400);
            }
        }

        initGame();
    </script>
</body>
</html>
