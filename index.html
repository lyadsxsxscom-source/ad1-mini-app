<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mall Games App Rewards</title>
    <!-- مكتبة تليجرام الرسمية للـ Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 400px;
            margin: 20px auto;
        }
        h1 { font-size: 22px; color: #0088cc; }
        p { font-size: 15px; color: #cccccc; line-height: 1.6; }
        .btn {
            display: block;
            width: 90%;
            padding: 14px;
            margin: 15px auto;
            background-color: #0088cc;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover { background-color: #006699; }
        .btn-adsterra { background-color: #ff9800; }
        .btn-adsterra:hover { background-color: #e68a00; }
        .btn:disabled { background-color: #555555; cursor: not-allowed; }
        .btn-claim { background-color: #4CAF50; }
        .btn-claim:hover { background-color: #45a049; }
        .hidden { display: none; }
        .timer-text { font-weight: bold; color: #ff9800; font-size: 16px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>مرحباً بك في Mall Games App! 🎁</h1>
        
        <!-- قسم التليجرام -->
        <div id="telegram-view" class="hidden">
            <p>أهلاً بك يا <b id="user-name" style="color: #0088cc;">مستخدم</b> 👋</p>
            <p>اختر إحدى الطرق التالية لجمع النقاط فوراً:</p>
            
            <!-- زر جدار عروض CPALead -->
            <a href="https://www.fastsvr.com/wall/UG2x1" class="btn" target="_blank">
                🎯 إكمال المهام والعروض (نقاط عالية)
            </a>
            
            <!-- زر Smartlink الخاص بـ Adsterra مع المؤقت -->
            <button id="ad-btn" class="btn btn-adsterra" onclick="startAdProcess()">
                ⚡ مشاهدة إعلان سريع (+10 نقاط)
            </button>
            
            <div id="timer-status" class="timer-text hidden"></div>
        </div>

        <!-- قسم المتصفح العادي -->
        <div id="browser-view" class="hidden">
            <p>لكسب النقاط وسحب المكافآت، يجب عليك فتح البوت وتأكيد حسابك عبر التليجرام.</p>
            <a href="https://t.me/mallgames_bot" class="btn">
                📲 تسجيل الدخول عبر Telegram
            </a>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;

        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            tg.expand();
            document.getElementById('telegram-view').classList.remove('hidden');
            const user = tg.initDataUnsafe.user;
            document.getElementById('user-name').innerText = user.first_name || "المستخدم";
        } else {
            document.getElementById('browser-view').classList.remove('hidden');
        }

        // رابط الإعلان
        const adUrl = "https://www.effectivecpmnetwork.com/g6tesg3dw?key=504cabf2ea751d490e611ef136c7f49b";
        let timeLeft = 30; // مدة الانتظار بالثواني
        let timerInterval;

        function startAdProcess() {
            // فتح رابط الإعلان في تبويب جديد
            window.open(adUrl, '_blank');

            const btn = document.getElementById('ad-btn');
            const timerStatus = document.getElementById('timer-status');
            
            btn.disabled = true;
            timerStatus.classList.remove('hidden');
            timerStatus.innerText = `⏳ انتظر ${timeLeft} ثانية للحصول على النقاط...`;

            timerInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    timerStatus.innerText = `⏳ انتظر ${timeLeft} ثانية للحصول على النقاط...`;
                } else {
                    clearInterval(timerInterval);
                    timerStatus.innerText = "🎉 اكتمل وقت الإعلان!";
                    btn.disabled = false;
                    btn.className = "btn btn-claim";
                    btn.innerText = "✅ اضغط هنا لاستلام النقاط";
                    btn.onclick = claimPoints;
                }
            }, 1000);
        }

        function claimPoints() {
            if (tg) {
                // إظهار تنبيه داخل التليجرام بتسليم النقاط
                tg.showAlert("تم إضافة 10 نقاط إلى حسابك بنجاح! 🪙");
                // إعادة الزر لحالته الأصلية
                setTimeout(() => { location.reload(); }, 1500);
            } else {
                alert("تم إضافة النقاط!");
            }
        }
    </script>

</body>
</html>
