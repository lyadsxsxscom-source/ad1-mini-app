<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mall Games App</title>
    <!-- مكتبة تليجرام -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: #ffffff; text-align: center; padding: 20px; margin: 0; }
        .card { background-color: #1e1e1e; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); max-width: 400px; margin: 20px auto; }
        h1 { font-size: 22px; color: #0088cc; }
        .btn { display: block; width: 90%; padding: 14px; margin: 15px auto; background-color: #0088cc; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; box-sizing: border-box; }
        .btn-adsterra { background-color: #ff9800; }
        .btn-claim { background-color: #4CAF50 !important; font-size: 17px; box-shadow: 0 0 10px #4CAF50; }
        .hidden { display: none; }
        .timer-text { font-weight: bold; color: #ff9800; font-size: 16px; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>مرحباً بك في Mall Games App! 🎁</h1>
        
        <div id="telegram-view" class="hidden">
            <p>أهلاً بك يا <b id="user-name" style="color: #0088cc;">...</b> 👋</p>
            
            <!-- زر العروض معدل ليكون جاهزاً للتتبع -->
            <a id="offerwall-link" href="#" class="btn" target="_blank">
                🎯 إكمال المهام والعروض
            </a>
            
            <button id="ad-btn" class="btn btn-adsterra" onclick="startAdProcess()">
                ⚡ مشاهدة إعلان سريع (+10 نقاط)
            </button>
            
            <div id="timer-status" class="timer-text hidden"></div>
        </div>

        <div id="browser-view" class="hidden">
            <p>يرجى فتح البوت عبر التليجرام للوصول للميزات.</p>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;

        if (tg) {
            tg.ready();
            tg.expand();
            document.getElementById('telegram-view').classList.remove('hidden');
            
            // --- كود التتبع الذكي للعروض ---
            const offerwallBase = "https://www.fastsvr.com/wall/UG2x1";
            const linkElement = document.getElementById('offerwall-link');
            
            // إضافة الـ ID الخاص بالمستخدم للرابط تلقائياً
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const userId = tg.initDataUnsafe.user.id;
                // يمكنك تغيير subid إلى user_id أو sid حسب ما تطلبه شركة العروض الخاصة بك
                linkElement.href = offerwallBase + "?subid=" + userId; 
            } else {
                linkElement.href = offerwallBase;
            }
            // -----------------------------

        } else {
            document.getElementById('browser-view').classList.remove('hidden');
        }

        // جلب الاسم
        function getUserName() {
            const urlParams = new URLSearchParams(window.location.search);
            const nameFromUrl = urlParams.get('name') || urlParams.get('first_name');
            if (nameFromUrl) return decodeURIComponent(nameFromUrl);
            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) return tg.initDataUnsafe.user.first_name;
            return null;
        }

        let nameFound = false;
        let checkCount = 0;
        const nameInterval = setInterval(() => {
            checkCount++;
            const name = getUserName();
            if (name) {
                document.getElementById('user-name').innerText = name;
                nameFound = true;
                clearInterval(nameInterval);
            } else if (checkCount > 40) {
                clearInterval(nameInterval);
                if (!nameFound) document.getElementById('user-name').innerText = "المستخدم";
            }
        }, 100);

        // كود الإعلانات
        const adUrl = "https://www.effectivecpmnetwork.com/g6tesg3dw?key=504cabf2ea751d490e611ef136c7f49b";
        let startTime = 0;
        const REQUIRED_SECONDS = 15;
        let checkInterval = null;
        let adWindow = null;

        function startAdProcess() {
            startTime = Date.now();
            adWindow = window.open(adUrl, '_blank');
            const btn = document.getElementById('ad-btn');
            const timerStatus = document.getElementById('timer-status');
            btn.disabled = true;
            timerStatus.classList.remove('hidden');
            timerStatus.innerText = `⏳ يرجى مشاهدة الإعلان لمدة 15 ثانية...`;
            if (checkInterval) clearInterval(checkInterval);
            checkInterval = setInterval(() => {
                if (startTime > 0) {
                    const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
                    if (REQUIRED_SECONDS - elapsedSeconds <= 0) {
                        clearInterval(checkInterval);
                        timerStatus.innerText = "🎉 انتهى الوقت! اضغط للتحصيل 👇";
                        btn.disabled = false;
                        btn.className = "btn btn-claim";
                        btn.innerText = "🎁 اضغط هنا لاستلام المكافأة (+10 نقاط)";
                        btn.onclick = claimReward;
                    }
                }
            }, 1000);
        }

        function claimReward() {
            if (adWindow && !adWindow.closed) try { adWindow.close(); } catch(e) {}
            if (tg) {
                tg.sendData(JSON.stringify({ action: "add_points", amount: 0.0010 }));
                setTimeout(() => { tg.close(); }, 800);
            }
        }
    </script>
</body>
</html>
