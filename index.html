<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mall Games App Rewards</title>
    <!-- مكتبة تليجرام الرسمية للـ Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 400px;
            margin: 20px auto;
        }
        h1 { font-size: 22px; color: #0088cc; }
        p { font-size: 15px; color: #cccccc; line-height: 1.6; }
        .btn {
            display: block;
            width: 90%;
            padding: 14px;
            margin: 15px auto;
            background-color: #0088cc;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover { background-color: #006699; }
        .btn-adsterra { background-color: #ff9800; }
        .btn-adsterra:hover { background-color: #e68a00; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h1>مرحباً بك في Mall Games App! 🎁</h1>
        
        <!-- قسم يظهر فقط إذا دخل الزائر من التليجرام -->
        <div id="telegram-view" class="hidden">
            <p>أهلاً بك يا <b id="user-name" style="color: #0088cc;">مستخدم</b> 👋</p>
            <p>اختر إحدى الطرق التالية لجمع النقاط فوراً:</p>
            
            <!-- زر جدار عروض CPALead -->
            <a href="https://www.fastsvr.com/wall/UG2x1" class="btn" target="_blank">
                🎯 إكمال المهام والعروض (نقاط عالية)
            </a>
            
            <!-- زر Smartlink الخاص بـ Adsterra -->
            <a href="https://www.effectivecpmnetwork.com/g6tesg3dw?key=504cabf2ea751d490e611ef136c7f49b" class="btn btn-adsterra" target="_blank">
                ⚡ مشاهدة إعلان سريع
            </a>
        </div>

        <!-- قسم يظهر فقط إذا دخل الزائر من متصفح عادي خارج التليجرام -->
        <div id="browser-view" class="hidden">
            <p>لكسب النقاط وسحب المكافآت، يجب عليك فتح البوت وتأكيد حسابك عبر التليجرام.</p>
            <a href="https://t.me/mallgames_bot" class="btn">
                📲 تسجيل الدخول عبر Telegram
            </a>
        </div>
    </div>

    <script>
        // التهيئة مع تليجرام
        const tg = window.Telegram ? window.Telegram.WebApp : null;

        // التحقق مما إذا كانت الصفحة مفتوحة داخل تطبيق التليجرام
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            tg.expand(); // توسيع الشاشة داخل البوت
            document.getElementById('telegram-view').classList.remove('hidden');
            
            // جلب اسم المستخدم من التليجرام
            const user = tg.initDataUnsafe.user;
            document.getElementById('user-name').innerText = user.first_name || "المستخدم";
        } else {
            // إذا كان زائر عادي من المتصفح
            document.getElementById('browser-view').classList.remove('hidden');
        }
    </script>

</body>
</html>
