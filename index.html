<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عداد 30 ثانية مع تنبيه</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        #timer {
            font-size: 48px;
            font-weight: bold;
            color: #2c3e50;
            margin: 20px 0;
        }

        button {
            padding: 12px 24px;
            font-size: 18px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }

        /* تنسيق الإعلان */
        .ad-container {
            margin-top: 20px;
            width: 100%;
            height: 300px;
            border: 2px dashed #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fafafa;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>انتظر انتهاء الوقت</h2>
        <div id="timer">30</div>
        <button id="startBtn" onclick="startTimer()">بدء العداد</button>

        <!-- منطقة الإعلان -->
        <div class="ad-container">
            <!-- يمكنك وضع كود الإعلان الخاص بك هنا -->
            <p style="color: #777;">[ منطقة عرض الإعلان ]</p>
        </div>
    </div>

    <script>
        let timeLeft = 30;
        let timerInterval = null;
        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('startBtn');
        const originalTitle = document.title;

        // دالة تشغيل صوت التنبيه عند الانتهاء (باستخدام Web Audio API بدون الحاجة لمكعبات صوتية خارجية)
        function playBeepSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                // تشغيل نغمتين متتاليتين للتنبيه
                [0, 0.2, 0.4].forEach(delay => {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    
                    osc.type = 'sine';
                    osc.frequency.value = 880; // تردد الصوت (نغمة عالية مسموعة)
                    
                    gain.gain.setValueAtTime(0.1, audioContext.currentTime + delay);
                    gain.gain.exponentialRampToValueAtTime(0.00001, audioContext.currentTime + delay + 0.15);
                    
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    
                    osc.start(audioContext.currentTime + delay);
                    osc.stop(audioContext.currentTime + delay + 0.15);
                });
            } catch (e) {
                console.log("الصوت غير مدعوم أو يتطلب تفاعل المتصفح أولاً");
            }
        }

        function startTimer() {
            // إعادة ضبط العداد إذا كان يعيد التشغيل
            clearInterval(timerInterval);
            timeLeft = 30;
            timerDisplay.textContent = timeLeft;
            document.title = originalTitle;
            startBtn.disabled = true;

            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerDisplay.textContent = "تم الانتهاء!";
                    startBtn.disabled = false;

                    // 1. تشغيل تنبيه صوتي
                    playBeepSound();

                    // 2. إهتزاز الهاتف (إن كان الجهاز يدعم ذلك)
                    if (navigator.vibrate) {
                        navigator.vibrate([200, 100, 200, 100, 400]);
                    }

                    // 3. تغيير عنوان المتصفح ليلفت انتباهك
                    document.title = "🔔 اكتمل الوقت!";
                }
            }, 1000);
        }
    </script>

</body>
</html>
