<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متصفح المهام والعروض</title>
    <!-- جلب مكتبة Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
            text-align: center;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #2c3e50;
            font-size: 22px;
            margin-bottom: 10px;
        }

        p {
            color: #7f8c8d;
            font-size: 14px;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 15px 0;
            margin-top: 15px;
            background-color: #0088cc;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #006699;
        }

        /* شاشة الحظر للـ VPN */
        .vpn-blocked {
            display: none;
            padding: 30px 15px;
            background-color: #ffe6e6;
            border: 2px solid #ff4d4d;
            border-radius: 12px;
            color: #cc0000;
        }

        .vpn-blocked h2 {
            margin-top: 0;
        }

        /* مؤشر التحميل */
        #loader {
            font-size: 16px;
            color: #0088cc;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- مؤشر فحص الـ VPN -->
        <div id="loader">⏳ جاري التحقق من أمان الاتصال...</div>

        <!-- شاشة الحظر (تظهر فقط عند تفعيل VPN) -->
        <div id="vpn-screen" class="vpn-blocked">
            <h2>⚠️ تم اكتشاف VPN / Proxy</h2>
            <p>عذراً، لا يمكنك استخدام التطبيق أثناء تفعيل الـ VPN أو تطبيق تغيير الموقع.</p>
            <p><strong>يرجى إيقاف الـ VPN وإعادة فتح التطبيق للمتابعة.</strong></p>
        </div>

        <!-- المحتوى الرئيسي (يظهر فقط إذا كان الاتصال آمناً) -->
        <div id="main-content" style="display: none;">
            <h1>أهلاً بك في قسم الاستبيانات 🎯</h1>
            <p>أكمل الاستبيانات المتاحة واكسب النقاط فوراً إلى حسابك!</p>
            
            <button class="btn" onclick="openCPX()">📋 فتح استبيانات CPX Research</button>
        </div>
    </div>

    <script>
        // تهيئة Telegram WebApp
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.expand(); // توسيع النافذة
        }

        // استخراج معرف المستخدم من تليجرام (user_id)
        let userId = "guest";
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userId = tg.initDataUnsafe.user.id;
        }

        // 🛡️ دالة فحص الـ VPN / Proxy
        async function checkSecurity() {
            const loader = document.getElementById('loader');
            const vpnScreen = document.getElementById('vpn-screen');
            const mainContent = document.getElementById('main-content');

            try {
                // فحص عنوان الـ IP عبر ip-api
                const response = await fetch('https://ip-api.com/json/?fields=status,message,proxy,hosting');
                const data = await response.json();

                // في حال كشف VPN أو Proxy أو سيرفر استضافة
                if (data.proxy || data.hosting) {
                    loader.style.display = 'none';
                    vpnScreen.style.display = 'block';
                    return false;
                }

                // الاتصال آمن
                loader.style.display = 'none';
                mainContent.style.display = 'block';
                return true;

            } catch (error) {
                console.error("خطأ أثناء الفحص:", error);
                // في حال فشل السيرفر في الفحص، اسمح للمستخدم بالدخول لتجنب تعطيل الخدمة
                loader.style.display = 'none';
                mainContent.style.display = 'block';
                return true;
            }
        }

        // 🚀 دالة فتح عروض CPX
        function openCPX() {
            // رابط CPX المباشر الخاص بك مع الـ App ID والـ User ID
            const appId = "35328";
            const cpxUrl = `https://offers.cpx-research.com/index.php?app_id=${appId}&ext_user_id=${userId}`;

            // فتح العروض داخل تليجرام أو المتصفح
            if (tg && tg.openLink) {
                tg.openLink(cpxUrl);
            } else {
                window.location.href = cpxUrl;
            }
        }

        // تشغيل فحص الأمان فور تحميل الصفحة
        window.onload = checkSecurity;
    </script>
</body>
</html>
