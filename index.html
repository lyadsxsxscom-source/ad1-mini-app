<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mall Games App</title>
  
  <!-- مكتبة تليجرام -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #151e27;
      color: #ffffff;
      padding: 20px;
      margin: 0;
      text-align: center;
    }
    .container { max-width: 400px; margin: 0 auto; }
    .hidden { display: none !important; }
    
    .welcome-box { font-size: 18px; margin-bottom: 20px; font-weight: bold; color: #38bdf8; }
    
    .btn {
      display: block; width: 100%; padding: 14px; margin: 12px 0; border: none; border-radius: 10px;
      font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none;
      box-sizing: border-box; color: #ffffff; transition: opacity 0.2s ease;
    }
    .btn:active { opacity: 0.8; }
    
    .btn-offerwall { background-color: #f59e0b; }
    .btn-ad { background-color: #10b981; }
    .btn-cpx { background-color: #0088cc; }
    .btn-claim { background-color: #ec4899; }
    
    .timer-status { margin-top: -6px; margin-bottom: 10px; font-size: 14px; color: #facc15; }

    /* شاشة حظر الـ VPN */
    .vpn-box {
      background-color: #3f1d24; border: 2px solid #ef4444;
      border-radius: 12px; padding: 20px; margin-top: 20px;
    }
    .vpn-box h2 { color: #f87171; margin-top: 0; font-size: 20px; }
  </style>
</head>
<body>

  <div class="container">
    <!-- شاشة التحميل -->
    <div id="loading-view">
      <p style="color: #38bdf8;">⏳ جاري التحقق من الأمان...</p>
    </div>

    <!-- شاشة الحظر -->
    <div id="vpn-view" class="hidden">
      <div class="vpn-box">
        <h2>⚠️ تم اكتشاف VPN</h2>
        <p>عذراً، يرجى إيقاف الـ VPN للمتابعة.</p>
      </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div id="telegram-view" class="hidden">
      <div class="welcome-box">مرحباً بك، <span id="user-name">المستخدم</span> 👋</div>

      <a id="offerwall-link" href="#" target="_blank" class="btn btn-offerwall">🔥 تنفيذ العروض (FastSvr)</a>
      
      <button id="ad-btn" onclick="startAdProcess()" class="btn btn-ad">🎬 مشاهدة إعلان (+10 نقاط)</button>
      <div id="timer-status" class="timer-status hidden"></div>

      <button onclick="openCpxSurveys()" class="btn btn-cpx">📋 استبيانات CPX Research</button>
    </div>

    <div id="browser-view" class="hidden">
      <p>يرجى فتح البوت عبر التليجرام.</p>
    </div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    const adUrl = "https://www.effectivecpmnetwork.com/g6tesg3dw?key=504cabf2ea751d490e611ef136c7f49b";
    let adWindow = null;
    let checkInterval = null;

    // 🛡️ فحص الـ VPN
    async function verifySecurityAndInit() {
      try {
        const res = await fetch('https://ipapi.co/json/');
        const data = await res.json();
        if (data.proxy || data.hosting) {
          document.getElementById('loading-view').classList.add('hidden');
          document.getElementById('vpn-view').classList.remove('hidden');
          return;
        }
      } catch (err) { console.log("تجاوز الفحص"); }

      document.getElementById('loading-view').classList.add('hidden');
      initApp();
    }

    // 🚀 بدء التطبيق
    function initApp() {
      if (tg) {
        tg.ready(); tg.expand();
        document.getElementById('telegram-view').classList.remove('hidden');
        const userId = (tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : "guest";
        document.getElementById('offerwall-link').href = "https://www.fastsvr.com/wall/UG2x1?subid=" + userId;
        startFetchingName();
      } else {
        document.getElementById('browser-view').classList.remove('hidden');
      }
    }

    // 🎬 نظام الإعلانات المحمي
    function startAdProcess() {
      let startTime = Date.now();
      const REQUIRED_SECONDS = 30;
      adWindow = window.open(adUrl, '_blank');
      
      const btn = document.getElementById('ad-btn');
      const timerStatus = document.getElementById('timer-status');
      
      btn.disabled = true;
      timerStatus.classList.remove('hidden');
      timerStatus.style.color = "#facc15";
      
      if (checkInterval) clearInterval(checkInterval);

      checkInterval = setInterval(() => {
        // فحص هل الإعلان لا يزال مفتوحاً
        if (adWindow && adWindow.closed) {
          clearInterval(checkInterval);
          timerStatus.style.color = "#ef4444";
          timerStatus.innerText = "❌ لقد أغلقت الإعلان قبل الوقت!";
          btn.disabled = false;
          return;
        }

        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const remaining = REQUIRED_SECONDS - elapsed;

        if (remaining > 0) {
          timerStatus.innerText = `⏳ متبقي ${remaining} ثانية... لا تغلق الصفحة!`;
        } else {
          clearInterval(checkInterval);
          timerStatus.style.color = "#10b981";
          timerStatus.innerText = "🎉 تم! اضغط للتحصيل 👇";
          btn.disabled = false;
          btn.className = "btn btn-claim";
          btn.innerText = "🎁 استلام المكافأة (+10 نقاط)";
          btn.onclick = claimReward;
        }
      }, 1000);
    }

    function claimReward() {
      if (adWindow && !adWindow.closed) try { adWindow.close(); } catch(e) {}
      if (tg) {
        tg.sendData(JSON.stringify({ action: "add_points", amount: 0.0010 }));
        setTimeout(() => { tg.close(); }, 800);
      }
    }

    // دوال مساعدة
    function openCpxSurveys() {
      const userId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : '123456';
      const url = `https://offers.cpx-research.com/index.php?app_id=35328&ext_user_id=${userId}`;
      tg ? tg.openLink(url) : window.open(url, '_blank');
    }

    function startFetchingName() {
      const name = (tg && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.first_name : "المستخدم";
      document.getElementById('user-name').innerText = name;
    }

    window.onload = verifySecurityAndInit;
  </script>
</body>
</html>
